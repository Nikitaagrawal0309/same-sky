name: Checks & security rules

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # The Firebase emulator needs Java.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      # Every attack in tests/rules must be blocked, and every normal app
      # action must still be allowed, or this fails.
      - name: Security rules attack tests
        shell: bash
        run: |
          set -o pipefail
          npm run test:rules 2>&1 | tee rules-test.log

      # Surface failures as annotations so they're readable on the public run page.
      - name: Report rules test failures
        if: failure()
        shell: bash
        run: |
          msg=$(grep -nE "not ok|Error|error|FIREBASE|PERMISSION|expected|✖|failed" rules-test.log | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/
/%0A/g')
          echo "::error title=Rules tests::$msg"
          tail -40 rules-test.log | sed ':a;N;$!ba;s/%/%25/g;s/
/%0A/g' | xargs -0 -I{} echo "::error title=Rules tests (tail)::{}"

      # Known-vulnerable dependencies (reported, not blocking).
      - run: npm audit --omit=dev --audit-level=critical
        continue-on-error: true
